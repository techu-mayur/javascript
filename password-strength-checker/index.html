<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Build a Robust Password Strength Checker with HTML, CSS & Bootstrap
    </title>
    <meta
      name="description"
      content="Learn how to create a powerful password strength checker using HTML, CSS, JavaScript, and Bootstrap 5 with insights from Techu Mayur."
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container mt-2">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card p-4 rounded-4 shadow-lg border-0">
            <h2 class="text-center mb-4">Password Strength Checker</h2>
            <div class="form-group position-relative">
              <label for="password">Enter Password:</label>
              <div class="input-group mb-3">
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="Enter your password"
                />
                <button
                  id="toggle-password"
                  class="btn btn-outline-secondary toggle-password"
                  type="button"
                >
                  <i id="toggle-icon" class="bi bi-eye-slash"></i>
                </button>
              </div>
            </div>
            <div class="strength-meter mt-3 d-flex align-items-center">
              <span id="strength-text" class="me-2">Password Strength: </span>
              <span id="strength-emoji">😶</span>
            </div>
            <div class="progress mt-2">
              <div
                id="strength-bar"
                class="progress-bar"
                role="progressbar"
                style="width: 0"
              ></div>
            </div>
            <!-- Password Requirements Checklist -->
            <div class="password-checklist mt-4">
              <h5>Your password should have:</h5>
              <ul class="list-unstyled">
                <li>
                  <input
                    type="checkbox"
                    id="char-length"
                    disabled
                    class="custom-checkbox"
                  />
                  <label for="char-length">More than 8 characters</label>
                </li>
                <li>
                  <input
                    type="checkbox"
                    id="uppercase"
                    disabled
                    class="custom-checkbox"
                  />
                  <label for="uppercase">At least 1 uppercase character</label>
                </li>
                <li>
                  <input
                    type="checkbox"
                    id="numeric"
                    disabled
                    class="custom-checkbox"
                  />
                  <label for="numeric">At least 1 numeric character</label>
                </li>
                <li>
                  <input
                    type="checkbox"
                    id="special-char"
                    disabled
                    class="custom-checkbox"
                  />
                  <label for="special-char"
                    >At least 1 special character (! @ # $ % ^ & *)</label
                  >
                </li>
                <li>
                  <input
                    type="checkbox"
                    id="no-ambiguous"
                    disabled
                    class="custom-checkbox"
                  />
                  <label for="no-ambiguous"
                    >No ambiguous characters ({ } [ ] ( ) / \ ' " ` ~ , ; : . <
                    >)</label
                  >
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
