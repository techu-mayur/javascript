<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Master the Awesome Toggle Password Visibility Feature | Techu Mayur
    </title>
    <meta
      name="description"
      content="Learn how to add an awesome toggle password visibility feature for better user experience.
"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Playwrite+DE+Grund:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <section id="password-visibility">
      <div class="container">
        <div class="row">
          <div class="col-12">
            <h1>Awesome Toggle <br />Password Visibility</h1>
          </div>
          <div class="col-12 position-relative">
            <form>
              <div class="form-group">
                <input
                  type="password"
                  name="password"
                  class="form-control password-box"
                  id="passwordBox"
                  placeholder="Enter Your Password..."
                />
                <small>(Click Image To View Password)</small>
                <span id="light"></span>
                <img
                  src="flashlight-off.png"
                  alt="flashlight-off"
                  onclick="lighton()"
                  class="flashlight img-fluid"
                  id="flashlight"
                />
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="init.js"></script>
  </body>
</html>
