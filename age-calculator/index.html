<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Comprehensive Age Calculator Using HTML, CSS, JavaScript and Bootstrap 5
    </title>
    <meta
      name="description"
      content="Experience the power of a fully functional age calculator made with HTML, CSS, and JavaScript."
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Loader Start Here -->
    <div class="loader"></div>
    <main>
      <section id="age-calculator">
        <div class="container">
          <div class="row">
            <div class="col-12 screen-one">
              <picture>
                <img
                  src="family.jpg"
                  alt="Tech Tutorials and Insights at techu mayur"
                  class="img-fluid"
                />
              </picture>
              <h2>How old Am I</h2>
              <p>
                Check your current age based upon<br />
                your date ot birth
              </p>
              <button class="next-button">
                <picture>
                  <img src="arrow.svg" class="img-fluid" alt="Next" />
                </picture>
              </button>
            </div>
            <div class="col-12 screen-two">
              <h2>Age Calculator</h2>
              <div class="calculator-box">
                <form metheod="post" id="your-date-of-birth">
                  <div class="form-group">
                    <label class="form-label">Your Date of Birth</label>
                    <input
                      type="date"
                      name="birth-date"
                      id="birth-date"
                      class="form-control"
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label">Today Date</label>
                    <input
                      type="date"
                      name="today-date"
                      id="today-date"
                      class="form-control"
                    />
                  </div>
                  <div class="form-grou">
                    <button type="submit" class="btn btn-lg main-btn">
                      Calculate Age
                    </button>
                  </div>
                </form>
              </div>
              <div class="age-display">
                <h3>You are (Your age right now)</h3>
                <ul class="list-unstyled d-flex" id="age-result">
                  <li id="years">0 <span>Years</span></li>
                  <li id="months">0 <span>Months</span></li>
                  <li id="days">0 <span>Days</span></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="init.js"></script>
  </body>
</html>
