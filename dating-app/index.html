<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tinder Clone</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div id="profile-card" class="card mx-auto" style="width: 18rem">
        <img
          src=""
          class="card-img-top"
          alt="profile picture"
          id="profileImage"
        />
        <div class="card-body text-center">
          <h5 class="card-title" id="profileName">John Doe, 25</h5>
          <p class="card-text" id="profileBio">Lorem ipsum dolor sit amet.</p>
          <div class="btn-group" role="group">
            <button type="button" class="btn btn-danger" id="dislikeBtn">
              Dislike
            </button>
            <button type="button" class="btn btn-success" id="likeBtn">
              Like
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
