<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Real-Time Crafting a Digital Clock with HTML, CSS, JS & Bootstrap 5
    </title>
    <meta
      name="description"
      content=" Real-Time  Digital Clock: Build with HTML, CSS & JS | Discover how to craft a real-time  digital clock using HTML, CSS, JS, and Bootstrap 5. "
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12">
          <div class="clock-heading">
            <h1 id="clock-heading">
              Real-Time Crafting a Digital Clock with HTML, CSS, JS & Bootstrap
              5
            </h1>
          </div>
          <div class="clock">
            <div class="clock-face">
              <div class="clock-number" data-number="12"></div>
              <div class="clock-number" data-number="1"></div>
              <div class="clock-number" data-number="3"></div>
              <div class="clock-number" data-number="5"></div>
              <div class="clock-number" data-number="6"></div>
              <div class="clock-number" data-number="7"></div>
              <div class="clock-number" data-number="9"></div>
              <div class="clock-number" data-number="11"></div>
              <div class="hand hour-hand"></div>
              <div class="hand minute-hand"></div>
              <div class="hand second-hand"></div>
              <div class="center-cap"></div>
            </div>
            <div class="clock-bg">
              <img src="clock.png" alt="clock" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="init.js"></script>
  </body>
</html>
